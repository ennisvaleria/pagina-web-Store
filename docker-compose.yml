version: '3.8'

services:
  web:
    build: .
    container_name: django_store_app
    expose:
      - "8000"
    volumes:
      - .:/app
    environment:
      DEBUG: "${DEBUG:-0}"
      PYTHONUNBUFFERED: "1"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      ADMIN_INITIAL_EMAIL: "${ADMIN_INITIAL_EMAIL:-admin@tienda.cl}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:?Define ADMIN_INITIAL_PASSWORD en tu entorno o archivo .env}"
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: django_store_nginx
    ports:
      - "79:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/srv/static:ro
      - ./media:/srv/media:ro
    depends_on:
      - web
    restart: always
