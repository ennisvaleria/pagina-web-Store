{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Panel{% endblock %} | TecStore</title>
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
</head>
<body>
    <aside class="lateral">
        <h1>TecStore</h1>
        <p class="sub">Panel de administrador</p>
        <a href="{% url 'panel_productos' %}">Productos</a>
        <a href="{% url 'panel_categorias' %}">Categorías</a>
        <a href="{% url 'panel_pedidos' %}">Pedidos</a>
        <a href="{% url 'panel_clientes' %}">Clientes</a>
        <div class="abajo">
            <a href="{% url 'inicio' %}">Ver tienda</a>
            <a href="{% url 'logout' %}">Cerrar sesión</a>
        </div>
    </aside>
    <main class="contenido">
        {% if messages %}
        <div class="mensajes">
            {% for message in messages %}
                <div class="msg {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
